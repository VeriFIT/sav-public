<link rel="icon" href="{{ '/assets/favicon.svg' | relative_url }}" type="image/svg+xml">
<link rel="icon" href="{{ '/assets/favicon-32.png' | relative_url }}" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="{{ '/assets/apple-touch-icon.png' | relative_url }}">

<script>
  // The table of contents is generated by kramdown at the top of index.md and
  // moved into the sidebar here, because just-the-docs builds its sidebar nav
  // from pages and this site is a single page.
  //
  // The class goes on before first paint so the in-content copy never flashes;
  // without JavaScript it is simply left where kramdown put it.
  document.documentElement.classList.add('has-sidebar-toc');

  document.addEventListener('DOMContentLoaded', function () {
    var toc = document.querySelector('#page-toc > ul');
    var nav = document.getElementById('site-nav');
    if (!toc || !nav) {
      document.documentElement.classList.remove('has-sidebar-toc');
      return;
    }

    // Only the top-level sections belong in the sidebar; drop the nested ones.
    Array.prototype.forEach.call(toc.querySelectorAll('ul'), function (ul) {
      ul.parentNode.removeChild(ul);
    });

    // Adopt the theme's own nav classes so the list looks native.
    toc.classList.add('nav-list', 'toc-nav');
    Array.prototype.forEach.call(toc.querySelectorAll('ul'), function (ul) {
      ul.classList.add('nav-list');
    });
    Array.prototype.forEach.call(toc.querySelectorAll('li'), function (li) {
      li.classList.add('nav-list-item');
    });
    Array.prototype.forEach.call(toc.querySelectorAll('a'), function (a) {
      a.classList.add('nav-list-link');
    });

    nav.textContent = '';
    nav.appendChild(toc);

    var wrapper = document.getElementById('page-toc');
    if (wrapper) {
      wrapper.parentNode.removeChild(wrapper);
    }
  });
</script>
