title: SAV
description: "Statická analýza a verifikace -- informace pro studenty, FIT VUT"
lang: cs

author:
  name: Ondřej Lengál
  email: "lengal@fit.vutbr.cz"

# GitHub Pages' built-in build cannot install arbitrary theme gems, so the theme
# is pulled in with jekyll-remote-theme. Pin the tag: an unpinned remote_theme
# would silently change the site whenever upstream releases.
remote_theme: just-the-docs/just-the-docs@v0.12.0

# Set explicitly rather than relying on GitHub's injection, so that a local
# build produces exactly the paths the deployed site uses.
url: "https://verifit.github.io"
baseurl: "/sav-public"
repository: VeriFIT/sav-public

# All three are on the GitHub Pages plugin allowlist.
plugins:
  - jekyll-remote-theme
  - jekyll-include-cache
  - jekyll-seo-tag

# Client-side search over headings and body text -- the main reason for this
# theme, given the ~120 tools and references listed on the page.
search_enabled: true
search:
  heading_level: 3
  previews: 2
  preview_words_before: 5
  preview_words_after: 10
  tokenizer_separator: /[\s/]+/
  rel_url: true

# Clickable anchors next to every heading, and a back-to-top link -- both help
# on a page this long.
heading_anchors: true
back_to_top: true
back_to_top_text: "Nahoru"

aux_links:
  "Karta předmětu (FIT)":
    - "https://www.fit.vut.cz/study/course/SAV"
  "GitHub":
    - "https://github.com/VeriFIT/sav-public"
aux_links_new_tab: true

footer_content: 'Dotazy: <a href="mailto:lengal@fit.vutbr.cz">O. Lengál</a>'

# just-the-docs' `default` layout is the themed shell and does not emit its own
# <h1>, so the heading at the top of index.md stays the only one.
#
# The second rule is required: some of the theme's assets carry front matter
# (assets/css/just-the-docs-head-nav.css), and an unscoped layout default wraps
# them in the HTML shell, serving a whole web page where a stylesheet belongs.
defaults:
  - scope:
      path: ""
    values:
      layout: "default"
  - scope:
      path: "assets"
    values:
      layout: null

# Legacy 2025 page: keep the lecture PDFs (linked from index.md), but do not
# publish the old HTML -- it references absolute paths from the FIT server
# (/common/style.css, /common/img/...) that do not exist here.
exclude:
  - OLD-2025/index.html
  - OLD-2025/00-BAK/
  - Gemfile
  - Gemfile.lock
  - vendor
